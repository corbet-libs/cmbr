[package]
name = "cmbr"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Membership facade of cvld: register, passkeys, enrolment and pins per community member"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cmbr"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[dependencies]
cplc = { git = "https://github.com/corbet-libs/cplc", rev = "a9d328d37501b0604c4e0c21d32c9c6a5200da09" }
cgts = { git = "https://github.com/corbet-libs/cgts", rev = "b1200a82039260e0597a966dcd435aeee193484e" }
cgrd = { git = "https://github.com/corbet-foss/cgrd", rev = "ff83c2b3fe786feb9b8c5f459b828ea1db4e6449", default-features = false }
crlt = { git = "https://github.com/corbet-foss/crlt", rev = "80dc046d6ab53b3ea530c45bf3d7038c8b2c61b2" }
crgs = { git = "https://github.com/corbet-foss/crgs", rev = "e691f9266401d7af8dc0acfd02ab7553299eeb8a" }
cpky = { git = "https://github.com/corbet-foss/cpky", rev = "5883d21b27d0cc5287d50e983505c91008b3b927" }
cnrl = { git = "https://github.com/corbet-foss/cnrl", rev = "11dd4b47f683b7de93951ad07a54e95e5b30ff9f" }
cpns = { git = "https://github.com/corbet-foss/cpns", rev = "d68a3f3a2df322c513d0e754e452ee02aab7a5b9" }
clbs = { git = "https://github.com/corbet-foss/clbs", rev = "873f2dd7388c6d5e025a27b4c55447c4b4892a2d" }
crbk = { git = "https://github.com/corbet-foss/crbk", rev = "954c17762df251c1354bd9303354d82b0a81e487" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }

[dev-dependencies]
passkey = "0.4"
async-trait = "0.1"
serde_cbor_2 = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }
ed25519-dalek = "2.2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev.package."*"]
opt-level = 3
