[package]
name = "cmbr"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Membership facade of cvld: register, passkeys, enrolment and pins per community member"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cmbr"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[dependencies]
cplc = { git = "https://github.com/corbet-libs/cplc", branch = "main" }
cgts = { git = "https://github.com/corbet-libs/cgts", branch = "main" }
cgrd = { git = "https://github.com/corbet-foss/cgrd", branch = "main", default-features = false }
crlt = { git = "https://github.com/corbet-foss/crlt", branch = "main" }
crgs = { git = "https://github.com/corbet-foss/crgs", branch = "main" }
ckyh = { git = "https://github.com/corbet-foss/ckyh", branch = "main" }
cnrl = { git = "https://github.com/corbet-foss/cnrl", branch = "main" }
cpns = { git = "https://github.com/corbet-foss/cpns", branch = "main" }
clbs = { git = "https://github.com/corbet-foss/clbs", branch = "main" }
crbk = { git = "https://github.com/corbet-foss/crbk", branch = "main" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }

[dev-dependencies]
passkey = "0.4"
async-trait = "0.1"
serde_cbor_2 = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }
ed25519-dalek = "2.2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev.package."*"]
opt-level = 3
